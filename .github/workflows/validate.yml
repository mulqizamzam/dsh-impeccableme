name: validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Skill bundle
        run: python scripts/validate_bundle.py
      - name: Check DSH plugin entrypoint syntax
        run: node --check index.js
      - name: Test runtime Skill registration
        run: node tests/test_bundle_entrypoint.mjs
      - name: Verify the Git install package contents
        run: |
          npm pack --dry-run --json > /tmp/npm-pack.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/npm-pack.json").read_text())[0]
          names = {item["path"] for item in result["files"]}
          required = {"package.json", "index.js", "cordis.patch.yml"}
          required |= {f".dsh/skills/{name}/SKILL.md" for name in (
              "project-context", "interface-blueprint", "ui-quality-audit",
              "visual-refinement", "system-documentation", "ux-content",
              "frontend-engineering", "workspace-operator")}
          missing = sorted(required - names)
          if missing:
              raise SystemExit("npm package is missing: " + ", ".join(missing))
          print(f"npm package contents: PASS ({len(names)} files)")
          PY
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check installer syntax
        run: bash -n scripts/install.sh
      - name: Test installer in temporary homes
        run: bash tests/test_installer.sh
      - name: Verify deterministic packaging
        run: |
          python scripts/package_release.py --output /tmp/package-a.zip
          python scripts/package_release.py --output /tmp/package-b.zip
          sha256sum /tmp/package-a.zip /tmp/package-b.zip
          cmp /tmp/package-a.zip /tmp/package-b.zip
