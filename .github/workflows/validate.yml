name: validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_bundle.py
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/install.sh
      - run: bash tests/test_installer.sh
      - run: |
          python scripts/package_release.py --output /tmp/a.zip
          python scripts/package_release.py --output /tmp/b.zip
          cmp /tmp/a.zip /tmp/b.zip
